version: 2

models:
  - name: stg_ga4_events
    description: >
      Staging view for the public GA4 ecommerce event dataset.
      This initial version standardizes event dates and timestamps.

    columns:
      - name: event_date
        description: Calendar date on which the GA4 event occurred.
        data_tests:
          - not_null

      - name: event_timestamp
        description: Timestamp at which the GA4 event occurred.
        data_tests:
          - not_null

      - name: event_name
        description: Name of the GA4 event.
        data_tests:
          - not_null

      - name: user_pseudo_id
        description: Anonymous GA4 user identifier.