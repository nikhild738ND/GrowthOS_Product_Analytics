version: 2

models:
  - name: int_sessions
    description: >
      One row per GA4 session, containing session attributes,
      engagement measures, ecommerce funnel flags, timestamps,
      transactions, and revenue.

    columns:
      - name: session_id
        description: Unique identifier for a GA4 user session.
        data_tests:
          - unique
          - not_null

      - name: user_pseudo_id
        description: Anonymous identifier of the user.
        data_tests:
          - not_null

      - name: session_date
        description: Calendar date on which the session began.
        data_tests:
          - not_null

      - name: session_start_at
        description: Timestamp of the first observed event in the session.
        data_tests:
          - not_null

      - name: session_end_at
        description: Timestamp of the last observed event in the session.
        data_tests:
          - not_null

      - name: session_duration_seconds
        description: >
          Seconds between the first and last observed event
          in the session.
        data_tests:
          - not_null

      - name: event_count
        description: Number of GA4 events recorded during the session.
        data_tests:
          - not_null

      - name: purchased
        description: True when the session contains a purchase event.
        data_tests:
          - not_null

      - name: transactions
        description: Number of distinct transaction IDs in the session.
        data_tests:
          - not_null

      - name: revenue_usd
        description: Deduplicated purchase revenue associated with the session.
        data_tests:
          - not_null

  - name: int_session_funnel
    description: >
      Creates an ordered ecommerce funnel at the session level.
      Each funnel event must occur after the previous valid event:
      view_item, add_to_cart, begin_checkout, and purchase.

    columns:
      - name: session_id
        description: Unique identifier for the customer session.
        data_tests:
          - unique
          - not_null

      - name: sequential_view_item_at
        description: Timestamp of the first valid product view in the session.

      - name: sequential_add_to_cart_at
        description: >
          Timestamp of the first add-to-cart event occurring after
          the valid product view.

      - name: sequential_begin_checkout_at
        description: >
          Timestamp of the first checkout event occurring after
          the valid add-to-cart event.

      - name: sequential_purchase_at
        description: >
          Timestamp of the first purchase event occurring after
          the valid checkout event.

      - name: deepest_sequential_stage_number
        description: >
          Highest valid ordered funnel stage reached by the session,
          from 0 through 4.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4]
                quote: false

      - name: deepest_sequential_stage
        description: Human-readable name of the deepest ordered funnel stage.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
               values:
                  - "0 - No product view"
                  - "1 - Product view"
                  - "2 - Add to cart"
                  - "3 - Checkout"
                  - "4 - Purchase"