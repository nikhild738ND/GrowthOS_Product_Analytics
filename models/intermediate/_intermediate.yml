version: 2

models:
  - name: int_sessions
    description: >
      One row per GA4 session, containing session attributes,
      engagement measures, ecommerce funnel flags, timestamps,
      transactions, and revenue.

    columns:
      - name: session_id
        description: Unique identifier for a GA4 user session.
        data_tests:
          - unique
          - not_null

      - name: user_pseudo_id
        description: Anonymous identifier of the user.
        data_tests:
          - not_null

      - name: session_date
        description: Calendar date on which the session began.
        data_tests:
          - not_null

      - name: session_start_at
        description: Timestamp of the first observed event in the session.
        data_tests:
          - not_null

      - name: session_end_at
        description: Timestamp of the last observed event in the session.
        data_tests:
          - not_null

      - name: session_duration_seconds
        description: >
          Seconds between the first and last observed event
          in the session.
        data_tests:
          - not_null

      - name: event_count
        description: Number of GA4 events recorded during the session.
        data_tests:
          - not_null

      - name: purchased
        description: True when the session contains a purchase event.
        data_tests:
          - not_null

      - name: transactions
        description: Number of distinct transaction IDs in the session.
        data_tests:
          - not_null

      - name: revenue_usd
        description: Deduplicated purchase revenue associated with the session.
        data_tests:
          - not_null

  - name: int_session_funnel
    description: >
      One row per GA4 session, comparing observed ecommerce events
      with an ordered funnel of product view, add to cart,
      begin checkout, and purchase.

    columns:
      - name: session_id
        description: Unique identifier for the GA4 session.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_sessions')
                field: session_id

      - name: sequential_view_item_at
        description: Timestamp of the first valid product view in the session.

      - name: sequential_add_to_cart_at
        description: >
          Timestamp of the first add-to-cart event occurring at or after
          the selected product-view event.

      - name: sequential_begin_checkout_at
        description: >
          Timestamp of the first checkout event occurring at or after
          the selected add-to-cart event.

      - name: sequential_purchase_at
        description: >
          Timestamp of the first purchase event occurring at or after
          the selected checkout event.

      - name: sequential_viewed_item
        description: >
          True when the session contains a product-view event
          that begins the ordered funnel.
        data_tests:
          - not_null

      - name: sequential_added_to_cart
        description: >
          True when an add-to-cart event occurred at or after
          the selected product-view event.
        data_tests:
          - not_null

      - name: sequential_began_checkout
        description: >
          True when a checkout event occurred at or after
          the selected add-to-cart event.
        data_tests:
          - not_null

      - name: sequential_purchased
        description: >
          True when a purchase occurred at or after
          the selected checkout event.
        data_tests:
          - not_null

      - name: completed_sequential_funnel
        description: >
          True when the session completed product view,
          add to cart, checkout, and purchase in order.
        data_tests:
          - not_null

      - name: has_funnel_order_gap
        description: >
          True when later-stage events were observed but could not
          be connected into the required ordered funnel.
        data_tests:
          - not_null

      - name: has_same_timestamp_transition
        description: >
          True when at least two adjacent funnel stages have
          the same exported event timestamp.
        data_tests:
          - not_null

      - name: deepest_sequential_stage_number
        description: >
          Farthest ordered funnel stage reached, from zero through four.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4]
                quote: false

      - name: deepest_sequential_stage
        description: Human-readable name of the farthest ordered stage reached.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "0 - No product view"
                  - "1 - Product view"
                  - "2 - Add to cart"
                  - "3 - Checkout"
                  - "4 - Purchase"

      - name: funnel_status
        description: >
          Indicates whether the session converted or the stage
          after which it dropped.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Converted
                  - Dropped after checkout
                  - Dropped after cart
                  - Dropped after product view
                  - No product view